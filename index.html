<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
     
    body, html { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      background: #222;  
      display: flex; justify-content: center; align-items: center;
    }

     
    .swiper { 
      width: 100%; 
      max-width: 480px;  
      height: 100vh; 
      background: #fff;  
      box-shadow: 0 0 30px rgba(0,0,0,0.5);  
    }

    .swiper-slide {
      width: 100%; height: 100%;
      overflow-y: auto;  
      -webkit-overflow-scrolling: touch;
    }

     
    .content-wrapper { 
      width: 100%; 
      display: flex; 
      flex-direction: column; 
      padding-top: 40px;  
      padding-bottom: 60px;  
    }
    
    img { width: 100%; display: block; border: none; margin-bottom: 5px; }
    
    .video-container {
      position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000;
      margin-bottom: 5px;
    }
    .video-container iframe {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
    }

    .text-box {
      padding: 25px 20px;
      font-size: 16px;
      line-height: 1.7;
      color: #333;
      word-break: break-all;
    }

     
    .swiper-pagination-bullet-active { background: #4285f4 !important; }
  </style>
</head>

<div class="swiper">

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  const swiper = new Swiper('.swiper', {
    direction: 'horizontal',
    loop: false,
    pagination: { el: '.swiper-pagination', clickable: true },
    
    
    mousewheel: {
      forceToAxis: true, 
      sensitivity: 1,    
      releaseOnEdges: true 
    },
    
    
    keyboard: {
      enabled: true,
      onlyInViewport: true,
    },

    on: {
      slideChange: function () {
        stopAllVideos();
      },
    },
  });

  function stopAllVideos() {
    const iframes = document.querySelectorAll('.yt-player');
    iframes.forEach(iframe => {
      iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
    });
  }
</script>
