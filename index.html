<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>모바일 의정보고서</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    :root {
      --app-max-width: 480px;
      --bg-color: #f8f9fa;
      --primary-color: #4285f4;
    }

    body, html { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      background: #1a1a1a;  
      display: flex; justify-content: center; align-items: center;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    .swiper { 
      width: 100%; 
      max-width: var(--app-max-width);
      height: 100vh; 
      background: var(--bg-color);
      box-shadow: 0 0 50px rgba(0,0,0,0.5);
    }

    .swiper-slide {
      width: 100%; height: 100%;
      overflow-y: auto;
      background: var(--bg-color);
       
      padding-top: env(safe-area-inset-top);
    }

     
    .content-wrapper { 
      width: 100%; 
      display: flex; 
      flex-direction: column; 
      padding: 30px 0 80px 0;  
    }

     
    .img-item { width: 100%; display: block; border: none; margin-bottom: 10px; }

     
    .yt-card {
      margin: 15px 15px 25px 15px;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid #eee;
    }

    .yt-title {
      padding: 18px 20px;
      font-size: 18px;
      font-weight: 800;
      color: #111;
      line-height: 1.4;
      border-left: 5px solid var(--primary-color);
    }

    .video-container {
      position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000;
    }
    .video-container iframe {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
    }

    .yt-script {
      padding: 20px;
      font-size: 15px;
      line-height: 1.7;
      color: #555;
      background: #fafafa;
      border-top: 1px solid #f0f0f0;
    }

     
    .text-box {
      padding: 20px;
      font-size: 16px;
      line-height: 1.7;
      color: #333;
      margin: 0 15px 15px 15px;
      background: #fff;
      border-radius: 12px;
    }

     
    .swiper-pagination-bullet { background: #ccc; opacity: 1; }
    .swiper-pagination-bullet-active { background: var(--primary-color); width: 20px; border-radius: 5px; }
  </style>
</head>
<body>

<div class="swiper">
  <div class="swiper-wrapper">
          <div class="swiper-slide">
        <div class="content-wrapper">
                                    <img class="img-item" src="https://born520.github.io/report/images/report01.jpg" loading="lazy">
            
                              </div>
      </div>
          <div class="swiper-slide">
        <div class="content-wrapper">
                                    <img class="img-item" src="https://born520.github.io/report/images/report02.jpg" loading="lazy">
            
                              </div>
      </div>
          <div class="swiper-slide">
        <div class="content-wrapper">
                                    <img class="img-item" src="https://born520.github.io/report/images/report03.jpg" loading="lazy">
            
                              </div>
      </div>
          <div class="swiper-slide">
        <div class="content-wrapper">

      </div>

        <div class="content-wrapper">
                                    <img class="img-item" src="https://born520.github.io/report/images/report05.jpg" loading="lazy">

          <div class="swiper-slide">
        <div class="content-wrapper">
                                    <img class="img-item" src="https://born520.github.io/report/images/report06.jpg" loading="lazy">
            
                              </div>
      </div>

        <div class="content-wrapper">
                                    <img class="img-item" src="https://born520.github.io/report/images/report07.jpg" loading="lazy">
            
                              </div>
      </div>
          <div class="swiper-slide">
        <div class="content-wrapper">
                                                    <div class="yt-card">
                  <div class="yt-title">[5분 자유발언] 송은영 의원_관광기념품 홍보관 설치 및 유통 활성화 촉구</div>

                </div>
              
                              </div>
      </div>
      </div>
  <div class="swiper-pagination"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  const swiper = new Swiper('.swiper', {
    direction: 'horizontal',
    pagination: { el: '.swiper-pagination', clickable: true },
    mousewheel: {
      forceToAxis: true,
      releaseOnEdges: true
    },
    on: {
      slideChange: function () {
        stopAllVideos();
        
        this.slides[this.activeIndex].scrollTop = 0;
      },
    },
  });

  function stopAllVideos() {
    document.querySelectorAll('.yt-player').forEach(iframe => {
      iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
    });
  }
</script>
</body>
</html>
