    body, html { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      background: #f0f2f5; 
      display: flex; justify-content: center; align-items: center; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      overflow: hidden;
    }
    
    .swiper { 
      width: 100%; height: 100%; 
      max-width: 480px; 
      position: relative; 
      background: #fff; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .swiper-slide {
      overflow-y: auto;
      overflow-x: hidden;
      display: block;
      -webkit-overflow-scrolling: touch;
    }

     
    .content-container { width: 100%; display: flex; flex-direction: column; }
    img { width: 100%; display: block; height: auto; border: none; }

     
    .video-container, .shorts-container { 
      position: relative; width: 100%; height: 0; background: #000; overflow: hidden;
    }
    .video-container { padding-bottom: 56.25%; }  
    .shorts-container { padding-bottom: 177.77%; }  

    .video-container iframe, .shorts-container iframe { 
      position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; border: none; 
    }

     
    .local-video-card { 
      width: 100%; background: #000; line-height: 0;
    }
    .local-video-container { 
      width: 100%; 
      position: relative;
      aspect-ratio: 16 / 9;  
      background: #000;
    }
    .local-video-container video { 
      width: 100%; height: 100%; object-fit: contain; 
    }

     
    .indicator {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); color: #fff; padding: 8px 16px; border-radius: 20px;
      font-size: 14px; z-index: 100; pointer-events: none; opacity: 0; transition: opacity 0.3s;
    }
    .indicator.show { opacity: 1; }

     
    .zoom-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 1000; display: none;
      justify-content: center; align-items: center; overflow: hidden;
    }
    .zoom-overlay img {
      max-width: 100%; max-height: 100%; transition: transform 0.1s ease-out; cursor: grab;
    }
    .zoom-overlay.active { display: flex; }
    .zoom-overlay img.zoomed { cursor: grabbing; }
  </style>

  <div class="zoom-overlay" id="zoomOverlay">
    <img src="" id="zoomImage">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const swiper = new Swiper('.swiper', {
      direction: 'vertical',
      mousewheel: true,
      touchStartPreventDefault: false,
      on: {
        init: function() { updateIndicator(this); },
        slideChange: function() { 
          updateIndicator(this);
          
          document.querySelectorAll('video').forEach(v => v.pause());
          document.querySelectorAll('iframe').forEach(f => {
            const src = f.src;
            f.src = src;
          });
        }
      }
    });

    function updateIndicator(s) {
      const el = document.getElementById('pageIndicator');
      el.textContent = `${s.activeIndex + 1} / ${s.slides.length}`;
      el.classList.add('show');
      clearTimeout(el.timer);
      el.timer = setTimeout(() => el.classList.remove('show'), 2000);
    }

    // 이미지 줌 기능 (터치 줌 대응)
    const overlay = document.getElementById('zoomOverlay');
    const zoomImg = document.getElementById('zoomImage');
    
    document.querySelectorAll('.zoomable').forEach(img => {
      img.addEventListener('click', () => {
        zoomImg.src = img.src;
        overlay.classList.add('active');
        zoomManager.reset();
      });
    });

    overlay.addEventListener('click', (e) => {
      if(e.target === overlay) overlay.classList.remove('active');
    });

    
    const zoomManager = {
      scale: 1, posX: 0, posY: 0,
      reset() {
        this.scale = 1; this.posX = 0; this.posY = 0;
        zoomImg.style.transform = `translate(0,0) scale(1)`;
      }
    };
  </script>
